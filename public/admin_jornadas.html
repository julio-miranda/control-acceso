<!DOCTYPE html>

<head>

  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
</head>

<body data-page="jornadas">
  <nav>
    <div class="navbar-logo">
      <a href="dashboard.html">Vértigo</a>
    </div>

    <button id="menu-toggle" class="menu-toggle" type="button">&#9776;</button>

    <div id="navbar-links" class="navbar-right">
      <ul id="menu">
        <li><a href="admin_perfil.html">Perfil</a></li>
        <li><a href="admin_empleados.html">Empleados</a></li>
        <li><a href="clientes_vip.html">VIP</a></li>
        <li><a href="admin_asistencias.html">Asistencias</a></li>
        <li><a href="admin_planilla.html">Planilla</a></li>
        <li><a href="inventory.html">Inventario</a></li>
        <li><a href="sales.html">Ventas</a></li>
        <li><a href="reservas.html">Reservas</a></li>
        <li><a href="admin_metricas_satisfaccion.html">Encuesta</a></li>
        <li>
          <button id="btnDescargarQr" type="button">Generar QR Empresa</button>
          <div id="qr-container" style="margin-top:10px;"></div>
        </li>
        <li>
          <button id="logout-button" type="button">Cerrar Sesión</button>
        </li>
      </ul>
    </div>
  </nav>

  <div id="jornadas-container" class="form-container">
    <h2>Gestión de Jornadas</h2>

    <form id="jornada-form">
      <div class="form-field">
        <label for="jornada-nombre">Nombre de la Jornada</label>
        <input type="text" id="jornada-nombre" required>
      </div>

      <div class="form-field">
        <label for="jornada-hora-entrada">Hora de Entrada</label>
        <input type="time" id="jornada-hora-entrada" required>
      </div>

      <div class="form-field">
        <label for="jornada-hora-salida">Hora de Salida</label>
        <input type="time" id="jornada-hora-salida" required>
      </div>

      <button type="submit" class="btn-primary">Guardar Jornada</button>
    </form>

    <hr>

    <table id="jornadasTable" class="display nowrap table" style="width:100%">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Hora Entrada</th>
          <th>Hora Salida</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.6/js/jquery.dataTables.min.js"></script>

  <script src="js/controllers/admin.asistencias_jornadas.controller.js?v=20260527-sales-prepared"></script>
</body>
</html>

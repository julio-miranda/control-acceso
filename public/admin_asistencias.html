<body data-page="asistencias">
  <nav>
    <div class="navbar-logo">
      <a href="dashboard.html">Vértigo</a>
    </div>

    <button id="menu-toggle" class="menu-toggle" type="button">&#9776;</button>

    <div id="navbar-links" class="navbar-right">
      <ul id="menu">
        <li><a href="admin_perfil.html">Perfil</a></li>

        <li><a href="clientes_vip.html">VIP</a></li>

        <li>

        </li>
      </ul>
    </div>

  <div id="tabla-asistencias" class="tabla-container">
    <h2>Control de Asistencias</h2>

    <div id="filtro-fechasa" class="panel-actions" style="margin-bottom:10px;">
      <div class="form-field">
        <label for="fechaInicioa">Inicio de Semana:</label>
        <input type="date" id="fechaInicioa" value="">
      </div>

      <div class="form-field">
        <label for="fechaFina">Fin de Semana:</label>
        <input type="date" id="fechaFina" value="">
      </div>
    </div>

    <button id="filtrarA" class="btn-primary" type="button">Filtrar</button>

    <table id="asistenciasTable" class="display nowrap table" style="width:100%">
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Fecha</th>
          <th>Escaneo</th>
          <th>Entrada</th>
          <th>Salida</th>
          <th>Justificación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

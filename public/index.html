<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Control de Asistencia</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Librerías necesarias -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.2.0/bcrypt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-cookie/3.0.5/js.cookie.min.js"></script>

  <!-- Supabase (CDN) y configuración -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=20260527-sales-prepared"></script>

  <!-- Lógica de autenticación / utilidades -->
  <script src="js/auth.js?v=20260527-sales-prepared"></script>

  <!-- MVC -->
  <script defer src="js/models/login.model.js?v=20260527-sales-prepared"></script>
  <script defer src="js/controllers/login.controller.js?v=20260527-sales-prepared"></script>
</head>

<body>
  <div class="section">
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Correo" required />
      <input type="password" id="login-password" placeholder="Contraseña" required />
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
